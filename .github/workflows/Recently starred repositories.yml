name: Recently starred repositories

on:
  # 每天自动运行
  schedule:
    - cron: '0 0 * * *'
  # 手动触发
  workflow_dispatch:
  # 每次推送到 main 分支时运行
  push:
    branches: [ main, master ]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📊 Generate recently starred repos
        uses: lowlighter/metrics@latest
        with:
          # === 必填配置 ===
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          
          # === 输出文件 ===
          filename: metrics.plugin.stars.svg
          
          # === Stars 插件配置 ===
          base: ""                                    # 不显示基础模板
          plugin_stars: yes                           # 启用 Stars 插件
          plugin_stars_limit: 3                       # 显示最近 3 个 star 的仓库
          
          # === 可选：更多 Stars 配置 ===
          # plugin_stars_ignored: owner/repo          # 忽略特定仓库
          # plugin_stars_days: 30                     # 只显示30天内 star 的
