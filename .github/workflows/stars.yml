name: Refresh recently starred repositories

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/stars.yml']
  workflow_dispatch:

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SakuraLoveForever
          filename: metrics.plugin.stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 6
          config_timezone: Asia/Shanghai
          config_display: large
